name: CPU installation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential zlib1g-dev python3 python3-numpy
      - name: Build and test cuPDLP-C
        env:
          MODE: cpu
        run: |
          bash build.sh
